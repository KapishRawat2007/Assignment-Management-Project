<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CSS CUSTOM PROPERTIES & COLOR SYSTEM
       ========================================================================== */
    :root {
      --bg-deep-space: #070913;
      --bg-space-radial: radial-gradient(circle at 50% 30%, #151b3b 0%, #0c0f24 45%, #050711 100%);
      
      --neon-cyan: #00f2fe;
      --neon-cyan-glow: rgba(0, 242, 254, 0.45);
      --neon-purple: #8a2be2;
      --neon-purple-glow: rgba(138, 43, 226, 0.45);
      --neon-magenta: #ff007f;
      --neon-magenta-glow: rgba(255, 0, 127, 0.45);
      --neon-gold: #ffb703;
      --neon-gold-glow: rgba(255, 183, 3, 0.45);
      --neon-emerald: #00f5a0;
      --neon-emerald-glow: rgba(0, 245, 160, 0.45);

      --glass-bg: rgba(255, 255, 255, 0.045);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-blur: blur(16px);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;

      --card-radius: 18px;
      --panel-radius: 24px;
      --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ==========================================================================
       BASE & RESET
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep-space);
      font-family: var(--font-body);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Background Canvas */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Ambient Glow Spots */
    .nebula-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      animation: nebulaPulse 14s ease-in-out infinite alternate;
    }

    .nebula-1 {
      top: -12%;
      left: 10%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, var(--neon-purple), transparent 70%);
    }

    .nebula-2 {
      bottom: -15%;
      right: 15%;
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, var(--neon-cyan), transparent 70%);
      animation-delay: -7s;
    }

    .nebula-3 {
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--neon-magenta), transparent 70%);
      opacity: 0.12;
    }

    @keyframes nebulaPulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.18; }
      50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.28; }
      100% { transform: scale(0.95) translate(-20px, 20px); opacity: 0.2; }
    }

    /* App Shell Container */
    #app-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      padding: 16px 24px 20px 24px;
      gap: 14px;
    }

    /* ==========================================================================
       HEADER & TOP CONTROLS
       ========================================================================== */
    header.command-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--panel-radius);
      box-shadow: 0 10px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 1px 1px rgba(255, 255, 255, 0.08);
      gap: 18px;
      flex-shrink: 0;
      transition: var(--transition-smooth);
    }

    /* Brand Section */
    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .gyro-logo {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .gyro-ring {
      position: absolute;
      border: 1.5px solid var(--neon-cyan);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spinGyro 5s linear infinite;
    }
    .gyro-ring:nth-child(1) { width: 44px; height: 44px; border-color: var(--neon-cyan); border-right-color: transparent; animation-duration: 6s; }
    .gyro-ring:nth-child(2) { width: 32px; height: 32px; border-color: var(--neon-purple); border-left-color: transparent; animation-duration: 4s; animation-direction: reverse; }
    .gyro-ring:nth-child(3) { width: 20px; height: 20px; border-color: var(--neon-magenta); border-bottom-color: transparent; animation-duration: 2.5s; }
    .gyro-core {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px #fff, 0 0 20px var(--neon-cyan);
    }

    @keyframes spinGyro {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-text h1 {
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 40%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* Progress Ring Widget */
    .orbital-progress-widget {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 16px 6px 10px;
      border-radius: 40px;
    }

    .ring-svg-container {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .ring-svg {
      width: 44px;
      height: 44px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 3.5;
    }

    .ring-meter {
      fill: none;
      stroke: url(#cosmicGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 75;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
    }

    .progress-meta {
      display: flex;
      flex-direction: column;
    }
    .progress-meta .meta-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .progress-meta .meta-sub {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--neon-cyan);
    }

    /* Search & Filter Bar */
    .search-filter-section {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 460px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 14px 0 38px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      color: var(--text-main);
      outline: none;
      transition: var(--transition-smooth);
    }

    .search-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 16px var(--neon-cyan-glow);
      background: rgba(15, 23, 42, 0.9);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .filter-select {
      height: 38px;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--text-muted);
      outline: none;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .filter-select:hover, .filter-select:focus {
      border-color: var(--neon-purple);
      color: #fff;
    }

    .filter-select option {
      background: #0f172a;
      color: #fff;
    }

    /* Controls Strip */
    .controls-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* GRAVITY SWITCH */
    .gravity-toggle-wrapper {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--glass-border);
      position: relative;
      cursor: pointer;
    }

    .gravity-toggle-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: color 0.3s ease;
      z-index: 2;
    }

    .gravity-toggle-btn.active {
      color: #050711;
      font-weight: 700;
    }

    .gravity-toggle-pill {
      position: absolute;
      top: 4px;
      left: 4px;
      height: calc(100% - 8px);
      width: 50%;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--neon-cyan), #38bdf8);
      box-shadow: 0 0 18px var(--neon-cyan-glow);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    .gravity-toggle-wrapper[data-mode="1g"] .gravity-toggle-pill {
      transform: translateX(100%);
      background: linear-gradient(135deg, #a855f7, var(--neon-purple));
      box-shadow: 0 0 18px var(--neon-purple-glow);
    }

    .gravity-toggle-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Icon Buttons */
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .icon-btn:hover {
      background: var(--glass-bg-hover);
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px var(--neon-cyan-glow);
    }

    .launch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-magenta) 100%);
      border: none;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
      transition: var(--transition-bounce);
      white-space: nowrap;
    }

    .launch-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 28px rgba(255, 0, 127, 0.6);
    }

    .launch-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* ==========================================================================
       SUB-NAV & FILTER STRIP
       ========================================================================== */
    .telemetry-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .telemetry-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .telemetry-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon-emerald);
      box-shadow: 0 0 8px var(--neon-emerald-glow);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .category-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-pill {
      padding: 3px 11px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .cat-pill:hover, .cat-pill.active {
      background: rgba(0, 242, 254, 0.12);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .telemetry-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
    }

    .gravity-mode-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 11px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.25);
      color: var(--neon-cyan);
      font-size: 0.72rem;
      font-weight: 600;
      transition: var(--transition-smooth);
    }

    /* ==========================================================================
       MAIN WORKSPACE (KANBAN STRUCTURED & DROP COLUMNS)
       ========================================================================== */
    #workspace {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: var(--panel-radius);
    }

    /* 1G STRUCTURED KANBAN BOARD */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      height: 100%;
      width: 100%;
      transition: opacity 0.4s ease;
    }

    /* COLUMNS / DROP ZONES */
    .magnetic-zone {
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--panel-radius);
      box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    /* Column Specific Glow Accents */
    .magnetic-zone[data-status="orbit"] {
      --zone-glow: var(--neon-cyan);
      --zone-glow-rgba: var(--neon-cyan-glow);
    }
    .magnetic-zone[data-status="thrusters"] {
      --zone-glow: var(--neon-purple);
      --zone-glow-rgba: var(--neon-purple-glow);
    }
    .magnetic-zone[data-status="docked"] {
      --zone-glow: var(--neon-emerald);
      --zone-glow-rgba: var(--neon-emerald-glow);
    }

    .magnetic-zone.drag-hover {
      border-color: var(--zone-glow) !important;
      box-shadow: 0 0 35px var(--zone-glow-rgba), inset 0 0 20px var(--zone-glow-rgba) !important;
      background: rgba(255, 255, 255, 0.08) !important;
    }

    /* Subtle background flux ring */
    .magnetic-flux-ring {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1px dashed var(--zone-glow);
      opacity: 0.15;
      pointer-events: none;
      animation: rotateFlux 20s linear infinite;
    }

    @keyframes rotateFlux {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Column Header */
    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      z-index: 2;
    }

    .zone-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .zone-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--zone-glow);
    }

    .zone-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }

    .zone-badge {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--zone-glow);
    }

    /* Card List Body in 1G Mode */
    .zone-cards {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 2;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .zone-cards::-webkit-scrollbar {
      width: 4px;
    }
    .zone-cards::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Zone Drop Target Hint */
    .zone-drop-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      height: 60px;
      border: 2px dashed var(--zone-glow);
      border-radius: var(--card-radius);
      background: rgba(255, 255, 255, 0.02);
      color: var(--zone-glow);
      font-family: var(--font-display);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .magnetic-zone.drag-hover .zone-drop-indicator {
      display: flex;
    }

    /* Zero-G placeholder hint */
    .zone-zero-g-hint {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
      gap: 8px;
      margin: auto 0;
    }

    .zone-zero-g-hint svg {
      width: 32px;
      height: 32px;
      opacity: 0.4;
      stroke: var(--zone-glow);
    }

    .zero-g-active .zone-zero-g-hint {
      display: flex;
    }

    /* Empty Column State */
    .zone-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-dim);
      text-align: center;
      gap: 10px;
      margin: auto 0;
    }

    .zone-empty-state svg {
      width: 40px;
      height: 40px;
      opacity: 0.3;
      stroke: currentColor;
    }

    .zone-empty-state p {
      font-size: 0.78rem;
      letter-spacing: 0.03em;
    }

    /* ==========================================================================
       ASSIGNMENT CARDS
       ========================================================================== */
    .card-graviton {
      position: relative;
      background: rgba(20, 27, 45, 0.7);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), inset 0 0 1px 1px rgba(255, 255, 255, 0.08);
      cursor: grab;
      touch-action: none;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    /* Dynamic Cursor Spotlight Layer */
    .card-graviton::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: var(--card-radius);
      background: radial-gradient(320px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.12), transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    .card-graviton:hover::before {
      opacity: 1;
    }

    /* PRIORITY TIERS */
    /* Low Priority: Fast drift, Cyan */
    .card-graviton[data-mass="low"] {
      --mass-color: var(--neon-cyan);
      --mass-glow: var(--neon-cyan-glow);
      --float-duration: 4.8s;
      border-color: rgba(0, 242, 254, 0.25);
    }
    /* Medium Priority: Stable, Purple */
    .card-graviton[data-mass="medium"] {
      --mass-color: var(--neon-purple);
      --mass-glow: var(--neon-purple-glow);
      --float-duration: 6.2s;
      border-color: rgba(138, 43, 226, 0.3);
    }
    /* High Priority: Heavy inertia, Pink/Magenta */
    .card-graviton[data-mass="high"] {
      --mass-color: var(--neon-magenta);
      --mass-glow: var(--neon-magenta-glow);
      --float-duration: 7.5s;
      border-color: rgba(255, 0, 127, 0.4);
      box-shadow: 0 12px 32px -5px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 0, 127, 0.25);
    }

    /* Staggered CSS Idle Float in Grid Mode */
    .card-graviton.idle-float {
      animation: floatGentle var(--float-duration, 5.5s) ease-in-out infinite;
    }

    .card-graviton.idle-float:nth-child(2n) {
      animation-delay: -1.8s;
      animation-duration: calc(var(--float-duration, 5.5s) + 0.8s);
    }

    .card-graviton.idle-float:nth-child(3n) {
      animation-delay: -3.4s;
      animation-duration: calc(var(--float-duration, 5.5s) - 0.6s);
    }

    @keyframes floatGentle {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(0.4deg);
      }
    }

    /* Card Content Structure */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .subject-pill {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subject-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .mass-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--mass-color);
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--mass-color);
      letter-spacing: 0.03em;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    .card-desc {
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Live Countdown Timer */
    .card-timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: rgba(0, 0, 0, 0.38);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }

    .timer-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .timer-val {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--neon-cyan);
    }

    .timer-val.urgent {
      color: var(--neon-gold);
      animation: pulseUrgent 1.5s infinite;
    }

    .timer-val.overdue {
      color: var(--neon-magenta);
    }

    @keyframes pulseUrgent {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Card Action Footer */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
      position: relative;
      z-index: 2;
    }

    .drag-handle-pill {
      font-size: 0.68rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.03em;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .card-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .card-btn.btn-advance:hover {
      background: rgba(0, 245, 160, 0.18);
      border-color: var(--neon-emerald);
      color: var(--neon-emerald);
    }

    .card-btn.btn-delete:hover {
      background: rgba(255, 0, 127, 0.22);
      border-color: var(--neon-magenta);
      color: var(--neon-magenta);
    }

    .card-btn svg {
      width: 13px;
      height: 13px;
    }

    /* ==========================================================================
       DEDICATED ZERO-G FLOATING ARENA
       ========================================================================== */
    #zero-g-arena {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 150;
      overflow: hidden;
      display: none;
    }

    .zero-g-active #zero-g-arena {
      display: block;
    }

    #zero-g-arena .card-graviton {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      width: 320px;
      pointer-events: auto;
      cursor: grab;
      box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 24px var(--mass-glow);
    }

    #zero-g-arena .card-graviton.is-dragging {
      cursor: grabbing;
      z-index: 250;
      box-shadow: 0 26px 55px -5px rgba(0, 0, 0, 0.8), 0 0 35px var(--mass-glow);
      transition: none !important;
    }

    .zero-g-active .magnetic-zone {
      border-style: dashed;
      background: rgba(255, 255, 255, 0.02);
    }

    /* ==========================================================================
       VFX: SUPERNOVA COMPLETION & BLACK HOLE DELETION
       ========================================================================== */
    /* Supernova Burst Animation */
    .supernova-burst {
      animation: supernovaBurst 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }

    @keyframes supernovaBurst {
      0% {
        transform: scale(1);
        filter: brightness(1) saturate(1);
      }
      30% {
        transform: scale(1.1);
        filter: brightness(2.6) saturate(2);
        box-shadow: 0 0 80px #fff, 0 0 120px var(--neon-cyan), 0 0 160px var(--neon-emerald);
      }
      60% {
        transform: scale(1.03);
        opacity: 0.9;
      }
      100% {
        transform: scale(1);
        filter: brightness(1);
        opacity: 1;
      }
    }

    /* Black Hole Vortex Collapse */
    .black-hole-collapse {
      pointer-events: none !important;
      animation: blackHoleSuck 0.85s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
    }

    @keyframes blackHoleSuck {
      0% {
        transform: scale(1) rotate(0deg);
        filter: brightness(1) blur(0px);
        opacity: 1;
      }
      40% {
        transform: scale(0.75) rotate(220deg);
        filter: brightness(2) contrast(2) hue-rotate(90deg) blur(2px);
        opacity: 0.9;
        box-shadow: 0 0 40px var(--neon-magenta);
      }
      100% {
        transform: scale(0.01) rotate(720deg);
        filter: brightness(4) blur(12px);
        opacity: 0;
      }
    }

    /* Singularity Vortex Overlay */
    .singularity-vortex {
      position: fixed;
      width: 150px;
      height: 150px;
      margin-left: -75px;
      margin-top: -75px;
      border-radius: 50%;
      background: radial-gradient(circle, #000 35%, #ff007f 65%, transparent 100%);
      box-shadow: 0 0 50px #ff007f, 0 0 90px #8a2be2;
      z-index: 999;
      pointer-events: none;
      animation: singularitySpin 0.9s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }

    @keyframes singularitySpin {
      0% { transform: scale(0) rotate(0deg); opacity: 0; }
      30% { transform: scale(1.25) rotate(360deg); opacity: 1; }
      70% { transform: scale(0.9) rotate(720deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(1080deg); opacity: 0; }
    }

    /* VFX Canvas */
    #vfx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 300;
      pointer-events: none;
    }

    /* ==========================================================================
       MODAL: ADD / EDIT ASSIGNMENT
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(7, 9, 19, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 90%;
      max-width: 520px;
      background: radial-gradient(circle at 50% 0%, #1e264a 0%, #0c1024 75%);
      border: 1px solid var(--glass-border);
      border-radius: var(--panel-radius);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 35px var(--neon-cyan-glow);
      padding: 28px;
      transform: scale(0.92) translateY(20px);
      transition: var(--transition-bounce);
      position: relative;
      overflow: hidden;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-title-wrap h3 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }

    .modal-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .modal-close-btn:hover {
      background: rgba(255, 0, 127, 0.2);
      color: var(--neon-magenta);
      border-color: var(--neon-magenta);
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: var(--font-body);
      font-size: 0.86rem;
      color: #fff;
      outline: none;
      transition: var(--transition-smooth);
    }

    .form-textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 16px var(--neon-cyan-glow);
      background: rgba(15, 23, 42, 0.95);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* Priority Selector */
    .mass-selector-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mass-radio-card {
      position: relative;
      cursor: pointer;
    }

    .mass-radio-card input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mass-radio-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--transition-smooth);
      text-align: center;
      gap: 2px;
    }

    .mass-radio-pill span.sub {
      font-size: 0.65rem;
      color: var(--text-dim);
    }

    .mass-radio-card input:checked + .mass-radio-pill {
      background: rgba(0, 242, 254, 0.12);
      border-color: var(--neon-cyan);
      color: #fff;
      box-shadow: 0 0 14px var(--neon-cyan-glow);
    }

    .mass-radio-card[data-mass="medium"] input:checked + .mass-radio-pill {
      background: rgba(138, 43, 226, 0.15);
      border-color: var(--neon-purple);
      box-shadow: 0 0 14px var(--neon-purple-glow);
    }

    .mass-radio-card[data-mass="high"] input:checked + .mass-radio-pill {
      background: rgba(255, 0, 127, 0.15);
      border-color: var(--neon-magenta);
      box-shadow: 0 0 14px var(--neon-magenta-glow);
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-secondary {
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
    }

    .btn-primary-launch {
      padding: 10px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--neon-cyan), #0072ff);
      border: none;
      color: #050711;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 0 20px var(--neon-cyan-glow);
      transition: var(--transition-bounce);
    }

    .btn-primary-launch:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 30px var(--neon-cyan-glow);
    }

    /* ==========================================================================
       TOAST NOTIFICATIONS
       ========================================================================== */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 600;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .cosmic-toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.82rem;
      transform: translateX(100%);
      opacity: 0;
      animation: toastSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cosmic-toast.toast-out {
      animation: toastSlideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes toastSlideIn {
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes toastSlideOut {
      to { transform: translateX(120%); opacity: 0; }
    }

    .toast-icon {
      font-size: 1.1rem;
    }

    /* ==========================================================================
       RESPONSIVE ADAPTATIONS
       ========================================================================== */
    @media (max-width: 1024px) {
      .kanban-grid {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      .command-header {
        flex-wrap: wrap;
      }
      .search-filter-section {
        order: 3;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Starfield Canvas -->
  <canvas id="space-canvas"></canvas>

  <!-- Ambient Glow Spots -->
  <div class="nebula-glow nebula-1"></div>
  <div class="nebula-glow nebula-2"></div>
  <div class="nebula-glow nebula-3"></div>

  <!-- Supernova Particle Overlay Canvas -->
  <canvas id="vfx-canvas"></canvas>

  <!-- Dedicated Zero-G Floating Arena (Active in Zero-G mode) -->
  <div id="zero-g-arena"></div>

  <!-- Main App Shell -->
  <div id="app-container">

    <!-- COMMAND HEADER -->
    <header class="command-header">
      <!-- Brand & Gyroscope -->
      <div class="brand-section">
        <div class="gyro-logo" title="Assign Flow">
          <div class="gyro-ring"></div>
          <div class="gyro-ring"></div>
          <div class="gyro-ring"></div>
          <div class="gyro-core"></div>
        </div>
        <div class="brand-text">
          <h1>Assign Flow</h1>
          <p>Student Assignment Tracker</p>
        </div>
      </div>

      <!-- Progress Ring -->
      <div class="orbital-progress-widget" title="Completion Progress">
        <div class="ring-svg-container">
          <svg class="ring-svg" viewBox="0 0 36 36">
            <defs>
              <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="50%" stop-color="#8a2be2" />
                <stop offset="100%" stop-color="#00f5a0" />
              </linearGradient>
            </defs>
            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="ring-meter" id="progress-meter" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="ring-text" id="progress-percent">0%</div>
        </div>
        <div class="progress-meta">
          <span class="meta-title">Completed</span>
          <span class="meta-sub" id="progress-stats">0 of 0 Done</span>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="search-filter-section">
        <div class="search-wrapper">
          <span class="search-icon">⚲</span>
          <input type="text" id="search-input" class="search-input" placeholder="Search assignments or subjects..." autocomplete="off">
        </div>
        <select id="sort-select" class="filter-select" title="Sort Assignments">
          <option value="due-asc">Due: Earliest First</option>
          <option value="due-desc">Due: Latest First</option>
          <option value="mass-desc">Priority: High to Low</option>
          <option value="mass-asc">Priority: Low to High</option>
          <option value="title-asc">Title: A to Z</option>
        </select>
      </div>

      <!-- Controls: Gravity Switch & Actions -->
      <div class="controls-section">
        <!-- Interactive Gravity Mode Toggle -->
        <div class="gravity-toggle-wrapper" id="gravity-toggle" data-mode="zero-g" title="Switch View Mode">
          <div class="gravity-toggle-pill"></div>
          <button type="button" class="gravity-toggle-btn active" id="btn-mode-zerog">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            Zero-G
          </button>
          <button type="button" class="gravity-toggle-btn" id="btn-mode-1g">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Grid View
          </button>
        </div>

        <!-- Audio Toggle -->
        <button type="button" class="icon-btn" id="audio-toggle" title="Toggle Sound Effects">
          <svg id="audio-icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <svg id="audio-icon-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>

        <!-- Reset Sample Data -->
        <button type="button" class="icon-btn" id="btn-reset-data" title="Reset Sample Assignments">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </button>

        <!-- New Assignment Trigger -->
        <button type="button" class="launch-btn" id="btn-open-modal">
          <span>+</span> Add Assignment
        </button>
      </div>
    </header>

    <!-- SUB-NAV / FILTER BAR -->
    <div class="telemetry-strip">
      <div class="telemetry-left">
        <div class="telemetry-item">
          <span class="status-dot"></span>
          <span>Status: <strong>Active</strong></span>
        </div>

  <script>

    // --- 1. DEFAULT DATASET & STORAGE ---
    const STORAGE_KEY = 'ASSIGNFLOW_TASKS_v3';

    const SAMPLE_ASSIGNMENTS = [

    // Global State
    const AppState = {
      assignments: [],
      gravityMode: 'zero-g', // 'zero-g' or '1g'
      filterSubject: 'all',
      searchQuery: '',
      sortBy: 'due-asc',
      audioEnabled: true,
