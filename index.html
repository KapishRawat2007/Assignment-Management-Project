    // --- 2. SYNTHESIZED WEB AUDIO ENGINE ---
    class CosmicAudioEngine {
      constructor() {
        this.ctx = null;
        this.initialized = false;
      }

      init() {
        if (!this.initialized && window.AudioContext) {
          try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
          } catch(e) {
            console.warn('Web Audio not supported', e);
          }
        }
      }

      playTone(freq, type = 'sine', duration = 0.2, gainVal = 0.1, pitchDecay = true) {
        if (!AppState.audioEnabled) return;
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (pitchDecay) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 0.4), this.ctx.currentTime + duration);
        }

        gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }

      // Whoosh sound
      thrusterSound() {
        if (!AppState.audioEnabled) return;
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const bufferSize = this.ctx.sampleRate * 0.35;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(400, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.35);
        filter.Q.value = 3;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start();
      }

      // Drop sound
      dockSound() {
        this.playTone(520, 'triangle', 0.25, 0.12, false);
        setTimeout(() => this.playTone(260, 'sine', 0.35, 0.15, true), 40);
      }

      // Supernova celebration arpeggio
      supernovaSound() {
        if (!AppState.audioEnabled) return;
        const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.3, 0.08, false);
          }, idx * 65);
        });
      }

      // Deletion sound
      blackHoleSound() {
        if (!AppState.audioEnabled) return;
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.7);

        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.7);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.7);
      }
    }

    const sound = new CosmicAudioEngine();
    window.addEventListener('pointerdown', () => sound.init(), { once: true });

    // --- 3. DYNAMIC STARFIELD & CURSOR REPULSION CANVAS ---
    class StarfieldSystem {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.stars = [];
        this.dust = [];
        this.shootingStars = [];
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Spawn Stars
        const starCount = Math.floor((this.width * this.height) / 5000);
        for (let i = 0; i < starCount; i++) {
          this.stars.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            size: Math.random() * 1.8 + 0.5,
            speed: Math.random() * 0.2 + 0.05,
            alpha: Math.random() * 0.8 + 0.2,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            color: Math.random() > 0.8 ? '#00f2fe' : (Math.random() > 0.6 ? '#8a2be2' : '#ffffff')
          });
        }

        // Dust particles that gently repel away from cursor
        const dustCount = 45;
        for (let i = 0; i < dustCount; i++) {
          this.dust.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            originX: Math.random() * this.width,
            originY: Math.random() * this.height,
            vx: 0,
            vy: 0,
            size: Math.random() * 2.5 + 1.2,
            color: Math.random() > 0.5 ? 'rgba(0, 242, 254, 0.45)' : 'rgba(255, 0, 127, 0.4)'
          });
        }

        this.animate();
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * window.devicePixelRatio;
        this.canvas.height = this.height * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      spawnShootingStar() {
        if (Math.random() < 0.008 && this.shootingStars.length < 2) {
          this.shootingStars.push({
            x: Math.random() * this.width,
            y: Math.random() * (this.height * 0.4),
            length: Math.random() * 80 + 40,
            speed: Math.random() * 10 + 12,
            angle: (Math.PI / 4) + (Math.random() * 0.2 - 0.1),
            alpha: 1
          });
        }
      }

      animate() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        // Render & Drift Stars
        for (let star of this.stars) {
          star.y -= star.speed;
          if (star.y < 0) {
            star.y = this.height;
            star.x = Math.random() * this.width;
          }
          star.alpha += star.twinkleSpeed;
          const currentAlpha = Math.sin(star.alpha) * 0.4 + 0.6;

          this.ctx.fillStyle = star.color;
          this.ctx.globalAlpha = currentAlpha;
          this.ctx.beginPath();
          this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          this.ctx.fill();
        }

        // Render & Repel Dust
        for (let p of this.dust) {
          const dx = p.x - AppState.mouse.x;
          const dy = p.y - AppState.mouse.y;
          const dist = Math.hypot(dx, dy);
          const maxDist = 160;

          if (dist < maxDist && dist > 1) {
            const force = (1 - dist / maxDist) * 3;
            p.vx += (dx / dist) * force;
            p.vy += (dy / dist) * force;
          }

          p.vx += (p.originX - p.x) * 0.01;
          p.vy += (p.originY - p.y) * 0.01;

          p.vx *= 0.92;
          p.vy *= 0.92;

          p.x += p.vx;
          p.y += p.vy;

          this.ctx.fillStyle = p.color;
          this.ctx.globalAlpha = 0.6;
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          this.ctx.fill();
        }

        // Shooting Stars
        this.spawnShootingStar();
        for (let i = this.shootingStars.length - 1; i >= 0; i--) {
          const s = this.shootingStars[i];
          s.x += Math.cos(s.angle) * s.speed;
          s.y += Math.sin(s.angle) * s.speed;
          s.alpha -= 0.025;

          this.ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`;
          this.ctx.lineWidth = 1.5;
          this.ctx.beginPath();
          this.ctx.moveTo(s.x, s.y);
          this.ctx.lineTo(s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);
          this.ctx.stroke();

          if (s.alpha <= 0 || s.x > this.width || s.y > this.height) {
            this.shootingStars.splice(i, 1);
          }
        }

        this.ctx.globalAlpha = 1.0;
        requestAnimationFrame(() => this.animate());
      }
    }

    // --- 4. SUPERNOVA PARTICLE SYSTEM ---
    class SupernovaSystem {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.shockwaves = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate();
      }

      resize() {
        this.canvas.width = window.innerWidth * window.devicePixelRatio;
        this.canvas.height = window.innerHeight * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      burst(x, y) {
        this.shockwaves.push({
          x, y,
          radius: 10,
          maxRadius: 180,
          alpha: 1,
          color: '#00f2fe'
        });

        const colors = ['#00f2fe', '#8a2be2', '#ff007f', '#00f5a0', '#ffffff', '#ffb703'];
        for (let i = 0; i < 75; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 8 + 2.5;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 3.5 + 1.5,
            alpha: 1,
            decay: Math.random() * 0.02 + 0.015,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      animate() {
        this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += (sw.maxRadius - sw.radius) * 0.12;
          sw.alpha -= 0.035;

          this.ctx.strokeStyle = sw.color;
          this.ctx.globalAlpha = Math.max(0, sw.alpha);
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();
          this.ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          this.ctx.stroke();

          if (sw.alpha <= 0) this.shockwaves.splice(i, 1);
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.95;
          p.vy *= 0.95;
          p.alpha -= p.decay;

          this.ctx.fillStyle = p.color;
          this.ctx.globalAlpha = Math.max(0, p.alpha);
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          this.ctx.fill();

          if (p.alpha <= 0) this.particles.splice(i, 1);
        }

        this.ctx.globalAlpha = 1.0;
        requestAnimationFrame(() => this.animate());
      }
    }

    // --- 5. ZERO-G 2D RIGID BODY PHYSICS ENGINE ---
    class ZeroGPhysicsEngine {
      constructor() {
        this.draggedCard = null;
        this.dragOffset = { x: 0, y: 0 };
        this.pointerVelocityTracker = [];
        this.initPointerListeners();
        this.loop();
      }

      initPointerListeners() {
        window.addEventListener('pointermove', (e) => {
          AppState.mouse.vx = e.clientX - AppState.mouse.x;
          AppState.mouse.vy = e.clientY - AppState.mouse.y;
          AppState.mouse.x = e.clientX;
          AppState.mouse.y = e.clientY;

          if (this.draggedCard) {
            const now = performance.now();
            this.pointerVelocityTracker.push({ x: e.clientX, y: e.clientY, time: now });
            if (this.pointerVelocityTracker.length > 5) {
              this.pointerVelocityTracker.shift();
            }

            const body = AppState.physicsCards.get(this.draggedCard.dataset.id);
            if (body) {
              body.x = e.clientX - this.dragOffset.x;
              body.y = e.clientY - this.dragOffset.y;
              body.vx = 0;
              body.vy = 0;
            }

            this.checkMagneticHover(e.clientX, e.clientY);
          }
        });

        window.addEventListener('pointerup', (e) => {
          if (this.draggedCard) {
            this.endDrag(e);
          }
        });
      }

      startDrag(cardEl, e) {
        if (AppState.gravityMode !== 'zero-g') return;

        this.draggedCard = cardEl;
        cardEl.classList.add('is-dragging');
        const rect = cardEl.getBoundingClientRect();
        this.dragOffset.x = e.clientX - rect.left;
        this.dragOffset.y = e.clientY - rect.top;

        this.pointerVelocityTracker = [{ x: e.clientX, y: e.clientY, time: performance.now() }];

        const body = AppState.physicsCards.get(cardEl.dataset.id);
        if (body) {
          body.isDragging = true;
        }

        sound.playTone(380, 'sine', 0.15, 0.08);
      }

      endDrag(e) {
        const cardEl = this.draggedCard;
        const id = cardEl.dataset.id;
        const body = AppState.physicsCards.get(id);

        cardEl.classList.remove('is-dragging');
        this.draggedCard = null;

        if (body) {
          body.isDragging = false;

          if (this.pointerVelocityTracker.length >= 2) {
            const first = this.pointerVelocityTracker[0];
            const last = this.pointerVelocityTracker[this.pointerVelocityTracker.length - 1];
            const dt = Math.max(1, last.time - first.time) / 1000;
            const throwVx = (last.x - first.x) / dt * 0.035;
            const throwVy = (last.y - first.y) / dt * 0.035;

            const massFactor = body.mass === 'high' ? 2.4 : (body.mass === 'medium' ? 1.6 : 1.0);
            body.vx = Math.max(-28, Math.min(28, throwVx / massFactor));
            body.vy = Math.max(-28, Math.min(28, throwVy / massFactor));
            body.vRot = (Math.random() - 0.5) * 2.0;
          }
        }

        const dropZone = this.getZoneAtPoint(e.clientX, e.clientY);
        if (dropZone) {
          const newStatus = dropZone.dataset.status;
          App.updateAssignmentStatus(id, newStatus);
          dropZone.classList.remove('drag-hover');
        }

        document.querySelectorAll('.magnetic-zone').forEach(z => z.classList.remove('drag-hover'));
      }

      checkMagneticHover(x, y) {
        document.querySelectorAll('.magnetic-zone').forEach(zone => {
          const rect = zone.getBoundingClientRect();
          if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
            zone.classList.add('drag-hover');
          } else {
            zone.classList.remove('drag-hover');
          }
        });
      }

      getZoneAtPoint(x, y) {
        const zones = document.querySelectorAll('.magnetic-zone');
        for (let zone of zones) {
          const rect = zone.getBoundingClientRect();
          if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
            return zone;
          }
        }
        return null;
      }

      loop() {
        if (AppState.gravityMode === 'zero-g') {
          const padding = 20;
          const winW = window.innerWidth;
          const winH = window.innerHeight;

          for (let [id, body] of AppState.physicsCards.entries()) {
            if (!body.element) continue;

            const cardW = body.element.offsetWidth || 320;
            const cardH = body.element.offsetHeight || 210;

            if (!body.isDragging) {
              const anchor = this.getColumnAnchor(body.status);
              if (anchor) {
                const dx = anchor.x - (body.x + cardW / 2);
                const dy = anchor.y - (body.y + cardH / 2);

                const pullStrength = 0.00042;
                body.vx += dx * pullStrength;
                body.vy += dy * pullStrength;
              }

              body.vx *= 0.985;
              body.vy *= 0.985;
              body.vRot *= 0.98;

              body.phase = (body.phase || 0) + 0.02;
              body.y += Math.sin(body.phase) * 0.16;

              body.x += body.vx;
              body.y += body.vy;
              body.rot += body.vRot;

              // Collision with window boundaries
              if (body.x < padding) {
                body.x = padding;
                body.vx = -body.vx * 0.72;
                body.vRot = (Math.random() - 0.5) * 1.0;
              } else if (body.x + cardW > winW - padding) {
                body.x = winW - padding - cardW;
                body.vx = -body.vx * 0.72;
                body.vRot = (Math.random() - 0.5) * 1.0;
              }

              const topPadding = 100;
              if (body.y < topPadding) {
                body.y = topPadding;
                body.vy = -body.vy * 0.72;
              } else if (body.y + cardH > winH - padding) {
                body.y = winH - padding - cardH;
                body.vy = -body.vy * 0.72;
              }
            }

            const tiltTransform = (body.tiltX !== undefined && body.tiltY !== undefined)
              ? ` perspective(1000px) rotateX(${body.tiltX}deg) rotateY(${body.tiltY}deg)`
              : '';

            body.element.style.transform = `translate3d(${body.x}px, ${body.y}px, 0) rotate(${body.rot}deg)${tiltTransform}`;
          }
        }

        requestAnimationFrame(() => this.loop());
      }

      getColumnAnchor(status) {
        const zone = document.querySelector(`.magnetic-zone[data-status="${status}"]`);
        if (!zone) return null;
        const rect = zone.getBoundingClientRect();
        return {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2
        };
      }
    }

    // --- 6. CORE APPLICATION LOGIC ---
    class AntigravityApp {
      constructor() {
        this.starfield = new StarfieldSystem('space-canvas');
        this.vfx = new SupernovaSystem('vfx-canvas');
        this.physics = new ZeroGPhysicsEngine();

        this.initElements();
        this.loadState();
        this.bindEvents();
        this.init1GDragAndDrop();
        this.renderAll();
        this.startTimerTicker();

        // Start in Zero-G view
        this.setGravityMode('zero-g', false);
      }

      initElements() {
        this.grid = document.getElementById('kanban-grid');
        this.zeroGArena = document.getElementById('zero-g-arena');
        this.modal = document.getElementById('mission-modal');
        this.form = document.getElementById('mission-form');
        this.searchInput = document.getElementById('search-input');
        this.sortSelect = document.getElementById('sort-select');
        this.gravityToggle = document.getElementById('gravity-toggle');
        this.btnZeroG = document.getElementById('btn-mode-zerog');
        this.btn1G = document.getElementById('btn-mode-1g');
        this.audioToggle = document.getElementById('audio-toggle');
        this.audioIconOn = document.getElementById('audio-icon-on');
        this.audioIconOff = document.getElementById('audio-icon-off');
        this.toastContainer = document.getElementById('toast-container');
        this.progressMeter = document.getElementById('progress-meter');
        this.progressPercent = document.getElementById('progress-percent');
        this.progressStats = document.getElementById('progress-stats');
        this.telemetryBadge = document.getElementById('telemetry-mode-badge');
      }

      loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            AppState.assignments = JSON.parse(stored);
          } else {
            AppState.assignments = JSON.parse(JSON.stringify(SAMPLE_ASSIGNMENTS));
            this.saveState();
          }
        } catch (e) {
          AppState.assignments = JSON.parse(JSON.stringify(SAMPLE_ASSIGNMENTS));
        }
      }

      saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState.assignments));
        } catch(e) {
          console.warn('LocalStorage save failed', e);
        }
        this.updateOrbitalProgress();
      }

      bindEvents() {
        this.btnZeroG.addEventListener('click', () => this.setGravityMode('zero-g'));
        this.btn1G.addEventListener('click', () => this.setGravityMode('1g'));

        this.audioToggle.addEventListener('click', () => {
          sound.init();
          AppState.audioEnabled = !AppState.audioEnabled;
          this.audioIconOn.style.display = AppState.audioEnabled ? 'block' : 'none';
          this.audioIconOff.style.display = AppState.audioEnabled ? 'none' : 'block';
          this.showToast(AppState.audioEnabled ? 'Sound Effects On' : 'Sound Effects Muted', '🔊');
          if (AppState.audioEnabled) sound.playTone(600, 'sine', 0.2);
        });

        this.searchInput.addEventListener('input', (e) => {
          AppState.searchQuery = e.target.value.toLowerCase().trim();
          this.renderAll();
        });

        this.sortSelect.addEventListener('change', (e) => {
          AppState.sortBy = e.target.value;
          this.renderAll();
        });

        // Subject Filter Pills
        document.getElementById('subject-filters').addEventListener('click', (e) => {
          const pill = e.target.closest('.cat-pill');
          if (!pill) return;
          document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          AppState.filterSubject = pill.dataset.subject;
          sound.playTone(480, 'sine', 0.1, 0.05);
          this.renderAll();
        });

        // Reset Sample Assignments
        document.getElementById('btn-reset-data').addEventListener('click', () => {
          if (confirm('Reset to sample assignments?')) {
            AppState.assignments = JSON.parse(JSON.stringify(SAMPLE_ASSIGNMENTS));
            AppState.physicsCards.clear();
            this.saveState();
            this.renderAll();
            this.showToast('Sample assignments restored', '✦');
            sound.dockSound();
          }
        });

        // Modal Controls
        document.getElementById('btn-open-modal').addEventListener('click', () => this.openModal());
        document.getElementById('btn-close-modal').addEventListener('click', () => this.closeModal());
        document.getElementById('btn-cancel-modal').addEventListener('click', () => this.closeModal());
        this.modal.addEventListener('click', (e) => {
          if (e.target === this.modal) this.closeModal();
        });

        this.form.addEventListener('submit', (e) => this.handleFormSubmit(e));
      }

      // --- 1G DRAG & DROP ---
      init1GDragAndDrop() {
        const zones = document.querySelectorAll('.magnetic-zone');
        zones.forEach(zone => {
          zone.addEventListener('dragover', (e) => {
            if (AppState.gravityMode !== '1g') return;
            e.preventDefault();
            zone.classList.add('drag-hover');
          });

          zone.addEventListener('dragleave', () => {
            zone.classList.remove('drag-hover');
          });

          zone.addEventListener('drop', (e) => {
            if (AppState.gravityMode !== '1g') return;
            e.preventDefault();
            zone.classList.remove('drag-hover');
            const cardId = e.dataTransfer.getData('text/plain');
            if (cardId) {
              this.updateAssignmentStatus(cardId, zone.dataset.status);
            }
          });
        });
      }

      // --- VIEW MODE TOGGLING ---
      setGravityMode(mode, playAudio = true) {
        AppState.gravityMode = mode;
        this.gravityToggle.setAttribute('data-mode', mode);

        if (mode === 'zero-g') {
          this.btnZeroG.classList.add('active');
          this.btn1G.classList.remove('active');
          document.body.classList.add('zero-g-active');
          this.telemetryBadge.innerHTML = 'Mode: <strong>Zero-G</strong> (Floating)';
          this.telemetryBadge.style.color = 'var(--neon-cyan)';
          if (playAudio) sound.thrusterSound();

          this.transferCardsToZeroG();
          this.showToast('Switched to Zero-G Mode', '🛸');
        } else {
          this.btn1G.classList.add('active');
          this.btnZeroG.classList.remove('active');
          document.body.classList.remove('zero-g-active');
          this.telemetryBadge.innerHTML = 'Mode: <strong>Grid View</strong>';
          this.telemetryBadge.style.color = 'var(--neon-purple)';
          if (playAudio) sound.dockSound();

          this.snapCardsTo1GGrid();
          this.showToast('Switched to Grid View', '⚓');
        }
      }

      transferCardsToZeroG() {
        const cards = Array.from(document.querySelectorAll('.card-graviton'));
        
        cards.forEach(card => {
          const id = card.dataset.id;
          const rect = card.getBoundingClientRect();

          this.zeroGArena.appendChild(card);
          card.classList.remove('idle-float');

          let body = AppState.physicsCards.get(id);
          if (!body) {
            body = {
              element: card,
              id: id,
              x: rect.left,
              y: rect.top,
              vx: (Math.random() - 0.5) * 3,
              vy: (Math.random() - 0.5) * 3,
              rot: (Math.random() - 0.5) * 4,
              vRot: (Math.random() - 0.5) * 0.4,
              mass: card.dataset.mass,
              status: card.dataset.status,
              isDragging: false,
              phase: Math.random() * Math.PI * 2
            };
            AppState.physicsCards.set(id, body);
          } else {
            body.element = card;
            body.x = rect.left;
            body.y = rect.top;
            body.vx = (Math.random() - 0.5) * 2.5;
            body.vy = (Math.random() - 0.5) * 2.5;
          }

          card.style.transform = `translate3d(${body.x}px, ${body.y}px, 0) rotate(${body.rot}deg)`;
        });
      }

      snapCardsTo1GGrid() {
        const containers = {
          orbit: document.getElementById('cards-orbit'),
          thrusters: document.getElementById('cards-thrusters'),
          docked: document.getElementById('cards-docked')
        };

        const cards = Array.from(this.zeroGArena.querySelectorAll('.card-graviton'));
        cards.forEach(card => {
          const status = card.dataset.status;
          if (containers[status]) {
            containers[status].appendChild(card);
          }
          card.classList.add('idle-float');
          card.style.transform = '';
          const body = AppState.physicsCards.get(card.dataset.id);
          if (body) {
            body.tiltX = 0;
            body.tiltY = 0;
          }
        });
      }

      // --- RENDERING PIPELINE ---
      getFilteredAssignments() {
        let list = [...AppState.assignments];

        if (AppState.searchQuery) {
          const q = AppState.searchQuery;
          list = list.filter(a => 
            a.title.toLowerCase().includes(q) ||
            a.subject.toLowerCase().includes(q) ||
            a.desc.toLowerCase().includes(q)
          );
        }

        if (AppState.filterSubject !== 'all') {
          list = list.filter(a => a.subject.toLowerCase() === AppState.filterSubject.toLowerCase());
        }

        list.sort((a, b) => {
          if (AppState.sortBy === 'due-asc') return new Date(a.due) - new Date(b.due);
          if (AppState.sortBy === 'due-desc') return new Date(b.due) - new Date(a.due);
          if (AppState.sortBy === 'mass-desc') {
            const weights = { high: 3, medium: 2, low: 1 };
            return weights[b.mass] - weights[a.mass];
          }
          if (AppState.sortBy === 'mass-asc') {
            const weights = { high: 3, medium: 2, low: 1 };
            return weights[a.mass] - weights[b.mass];
          }
          if (AppState.sortBy === 'title-asc') return a.title.localeCompare(b.title);
          return 0;
        });

        return list;
      }

      renderAll() {
        const assignments = this.getFilteredAssignments();

        const containers = {
          orbit: document.getElementById('cards-orbit'),
          thrusters: document.getElementById('cards-thrusters'),
          docked: document.getElementById('cards-docked')
        };

        const counts = { orbit: 0, thrusters: 0, docked: 0 };

        this.zeroGArena.innerHTML = '';
        Object.keys(containers).forEach(status => {
          const dropInd = containers[status].querySelector('.zone-drop-indicator');
          const zeroGHint = containers[status].querySelector('.zone-zero-g-hint');
          containers[status].innerHTML = '';
          if (dropInd) containers[status].appendChild(dropInd);
          if (zeroGHint) containers[status].appendChild(zeroGHint);
        });

        assignments.forEach(item => {
          counts[item.status] = (counts[item.status] || 0) + 1;
          const cardEl = this.createCardElement(item);

          if (AppState.gravityMode === 'zero-g') {
            this.zeroGArena.appendChild(cardEl);

            let body = AppState.physicsCards.get(item.id);
            if (!body) {
              const zone = document.querySelector(`.magnetic-zone[data-status="${item.status}"]`);
              const zoneRect = zone ? zone.getBoundingClientRect() : { left: 150, top: 200, width: 300, height: 300 };
              body = {
                element: cardEl,
                id: item.id,
                x: zoneRect.left + (Math.random() * (zoneRect.width - 320)),
                y: zoneRect.top + 50 + (Math.random() * (zoneRect.height - 250)),
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                rot: (Math.random() - 0.5) * 4,
                vRot: (Math.random() - 0.5) * 0.3,
                mass: item.mass,
                status: item.status,
                isDragging: false,
                phase: Math.random() * Math.PI * 2
              };
              AppState.physicsCards.set(item.id, body);
            } else {
              body.element = cardEl;
              body.status = item.status;
              body.mass = item.mass;
            }

            cardEl.style.transform = `translate3d(${body.x}px, ${body.y}px, 0) rotate(${body.rot}deg)`;
          } else {
            containers[item.status].appendChild(cardEl);
            cardEl.classList.add('idle-float');
          }
        });

        document.getElementById('badge-orbit').textContent = counts.orbit;
        document.getElementById('badge-thrusters').textContent = counts.thrusters;
        document.getElementById('badge-docked').textContent = counts.docked;

        if (AppState.gravityMode === '1g') {
          Object.keys(containers).forEach(status => {
            if (counts[status] === 0) {
              const emptyEl = document.createElement('div');
              emptyEl.className = 'zone-empty-state';
              emptyEl.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M9 12h6m-3-3v6"/>
                </svg>
                <p>No assignments here</p>
              `;
              containers[status].appendChild(emptyEl);
            }
          });
        }

        this.updateOrbitalProgress();
      }

      createCardElement(item) {
        const card = document.createElement('article');
        card.className = 'card-graviton';
        card.dataset.id = item.id;
        card.dataset.mass = item.mass;
        card.dataset.status = item.status;
        card.draggable = true;

        const subjectColors = {
          'Math': '#00f2fe',
          'Science': '#8a2be2',
          'History': '#ff007f',
          'English': '#00f5a0',
          'Computer Science': '#ffb703'
        };
        const dotColor = subjectColors[item.subject] || '#38bdf8';

        const priorityLabels = {
          low: 'Low',
          medium: 'Medium',
          high: 'High'
        };

        const isDocked = item.status === 'docked';

        card.innerHTML = `
          <div class="card-top">
            <span class="subject-pill">
              <span class="subject-dot" style="background: ${dotColor}; box-shadow: 0 0 6px ${dotColor}"></span>
              ${this.escapeHtml(item.subject)}
            </span>
            <div class="mass-badge" title="Priority">
              <span>${priorityLabels[item.mass] || 'Medium'}</span>
            </div>
          </div>

          <h3 class="card-title">${this.escapeHtml(item.title)}</h3>
          <p class="card-desc">${this.escapeHtml(item.desc || 'No additional notes.')}</p>

          <div class="card-timer-row">
            <span class="timer-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Due In
            </span>
            <span class="timer-val" data-due="${item.due}">Calculating...</span>
          </div>

          <div class="card-footer">
            <span class="drag-handle-pill" title="Drag to move card">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
              <span>Drag</span>
            </span>
            <div class="card-actions">
              ${!isDocked ? `
                <button type="button" class="card-btn btn-advance" title="Mark as Completed" data-action="advance">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
              ` : `
                <button type="button" class="card-btn" title="Move back to In Progress" data-action="relaunch">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
              `}
              <button type="button" class="card-btn" title="Edit Assignment" data-action="edit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              </button>
              <button type="button" class="card-btn btn-delete" title="Delete Assignment" data-action="delete">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          </div>
        `;

        this.attachCardInteractivity(card, item);

        return card;
      }

      attachCardInteractivity(card, item) {
        card.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button')) return;
          if (AppState.gravityMode === 'zero-g') {
            this.physics.startDrag(card, e);
          }
        });

        card.addEventListener('dragstart', (e) => {
          if (AppState.gravityMode === '1g') {
            e.dataTransfer.setData('text/plain', item.id);
            card.style.opacity = '0.5';
          } else {
            e.preventDefault();
          }
        });

        card.addEventListener('dragend', () => {
          card.style.opacity = '1';
        });

        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = ((y - centerY) / centerY) * -11;
          const rotateY = ((x - centerX) / centerX) * 11;

          if (AppState.gravityMode === '1g') {
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
          } else {
            const body = AppState.physicsCards.get(item.id);
            if (body) {
              body.tiltX = rotateX;
              body.tiltY = rotateY;
            }
          }
        });

        card.addEventListener('mouseleave', () => {
          if (AppState.gravityMode === '1g') {
            card.style.transform = '';
          } else {
            const body = AppState.physicsCards.get(item.id);
            if (body) {
              body.tiltX = 0;
              body.tiltY = 0;
            }
          }
        });

        card.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === 'advance') {
            this.supernovaComplete(item.id, card);
          } else if (action === 'relaunch') {
            this.updateAssignmentStatus(item.id, 'thrusters');
            sound.dockSound();
          } else if (action === 'edit') {
            this.openEditModal(item);
          } else if (action === 'delete') {
            this.blackHoleDelete(item.id, card);
          }
        });
      }

      // --- SUPERNOVA COMPLETION ---
      supernovaComplete(id, cardEl) {
        sound.supernovaSound();

        const rect = cardEl.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        this.vfx.burst(centerX, centerY);
        cardEl.classList.add('supernova-burst');
        this.showToast('Assignment completed! 🎉', '✨');

        setTimeout(() => {
          this.updateAssignmentStatus(id, 'docked');
        }, 550);
      }

      // --- DELETION VORTEX ---
      blackHoleDelete(id, cardEl) {
        sound.blackHoleSound();

        const rect = cardEl.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const singularity = document.createElement('div');
        singularity.className = 'singularity-vortex';
        singularity.style.left = `${centerX}px`;
        singularity.style.top = `${centerY}px`;
        document.body.appendChild(singularity);

        cardEl.classList.add('black-hole-collapse');
        this.showToast('Assignment deleted.', '🗑️');

        setTimeout(() => {
          singularity.remove();
          AppState.assignments = AppState.assignments.filter(a => a.id !== id);
          AppState.physicsCards.delete(id);
          this.saveState();
          this.renderAll();
        }, 850);
      }

      updateAssignmentStatus(id, newStatus) {
        const item = AppState.assignments.find(a => a.id === id);
        if (item && item.status !== newStatus) {
          item.status = newStatus;
          const body = AppState.physicsCards.get(id);
          if (body) body.status = newStatus;
          this.saveState();
          this.renderAll();
          sound.dockSound();
        }
      }

      // --- PROGRESS GAUGE ---
      updateOrbitalProgress() {
        const total = AppState.assignments.length;
        const completed = AppState.assignments.filter(a => a.status === 'docked').length;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        this.progressPercent.textContent = `${percent}%`;
        this.progressStats.textContent = `${completed} of ${total} Done`;

        const offset = 100 - percent;
        this.progressMeter.style.strokeDashoffset = offset;
      }

      // --- LIVE TIMER TICKER ---
      startTimerTicker() {
        const updateTimers = () => {
          const now = Date.now();
          document.querySelectorAll('.timer-val').forEach(el => {
            const dueStr = el.dataset.due;
            if (!dueStr) return;

            const dueTime = new Date(dueStr).getTime();
            const diff = dueTime - now;

            if (diff <= 0) {
              const absDiff = Math.abs(diff);
              const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
              const hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
              el.textContent = `Overdue (${days > 0 ? days + 'd ' : ''}${hours}h ago)`;
              el.className = 'timer-val overdue';
            } else {
              const days = Math.floor(diff / (1000 * 60 * 60 * 24));
              const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
              const minutes = Math.floor((diff % (1000 * 60)) / 1000);
              const seconds = Math.floor((diff % 1000) / 100);

              let text = '';
              if (days > 0) {
                text = `${days}d ${hours}h left`;
              } else {
                text = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')} left`;
              }

              el.textContent = text;
              el.className = diff < 1000 * 60 * 60 * 24 ? 'timer-val urgent' : 'timer-val';
            }
          });
        };

        updateTimers();
        setInterval(updateTimers, 1000);
      }

      // --- MODAL CONTROLS ---
      openModal(editingItem = null) {
        sound.playTone(500, 'sine', 0.15, 0.08);
        this.form.reset();

        if (editingItem) {
          document.getElementById('modal-heading').textContent = 'Edit Assignment';
          document.getElementById('form-edit-id').value = editingItem.id;
          document.getElementById('form-title').value = editingItem.title;
          document.getElementById('form-subject').value = editingItem.subject;
          document.getElementById('form-due').value = editingItem.due;
          document.getElementById('form-desc').value = editingItem.desc || '';
          
          const massRadio = this.form.querySelector(`input[name="mass"][value="${editingItem.mass}"]`);
          if (massRadio) massRadio.checked = true;
          document.getElementById('btn-submit-mission').textContent = 'Save Changes';
        } else {
          document.getElementById('modal-heading').textContent = 'Add Assignment';
          document.getElementById('form-edit-id').value = '';
          const defaultDue = new Date(Date.now() + 1000 * 60 * 60 * 24);
          defaultDue.setHours(18, 0, 0, 0);
          document.getElementById('form-due').value = defaultDue.toISOString().slice(0, 16);
          document.getElementById('btn-submit-mission').textContent = 'Add Assignment';
        }

        this.modal.classList.add('active');
        document.getElementById('form-title').focus();
      }

      openEditModal(item) {
        this.openModal(item);
      }

      closeModal() {
        this.modal.classList.remove('active');
      }

      handleFormSubmit(e) {
        e.preventDefault();
        const editId = document.getElementById('form-edit-id').value;
        const title = document.getElementById('form-title').value.trim();
        const subject = document.getElementById('form-subject').value.trim() || 'General';
        const due = document.getElementById('form-due').value;
        const desc = document.getElementById('form-desc').value.trim();
        const mass = this.form.querySelector('input[name="mass"]:checked').value;

        if (!title || !due) return;

        if (editId) {
          const item = AppState.assignments.find(a => a.id === editId);
          if (item) {
            item.title = title;
            item.subject = subject;
            item.due = due;
            item.desc = desc;
            item.mass = mass;
            this.showToast('Assignment updated!', '📝');
          }
        } else {
          const newItem = {
            id: 'asg-' + Date.now().toString(36),
            title,
            subject,
            due,
            desc,
            mass,
            status: 'orbit'
          };
          AppState.assignments.unshift(newItem);
          this.showToast('New assignment added!', '🚀');
          sound.thrusterSound();
        }

        this.saveState();
        this.renderAll();
        this.closeModal();
      }

      // --- TOAST ALERTS ---
      showToast(message, icon = '✦') {
        const toast = document.createElement('div');
        toast.className = 'cosmic-toast';
        toast.innerHTML = `
          <span class="toast-icon">${icon}</span>
          <span>${this.escapeHtml(message)}</span>
        `;
        this.toastContainer.appendChild(toast);

        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => toast.remove(), 350);
        }, 3200);
      }

      escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    }

    // Launch Application
    window.addEventListener('DOMContentLoaded', () => {
      window.App = new AntigravityApp();
    });
  </script>
</body>
</html>
